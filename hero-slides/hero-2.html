<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>Hero 2 · 血糖指数</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #cbd5e1; min-height: 100vh; display: grid; place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }
  .slide {
    width: 660px; height: 1440px; position: relative; overflow: hidden;
    background: linear-gradient(180deg, #fffbeb 0%, #fef3c7 46%, #f7fee7 100%);
  }
  .copy { position: absolute; top: 128px; left: 0; right: 0; text-align: center; padding: 0 36px; }
  .tag {
    display: inline-block; font-size: 26px; font-weight: 700; color: #92400e;
    background: #fde68a; padding: 12px 30px; border-radius: 999px; margin-bottom: 38px;
  }
  h1 { font-size: 70px; line-height: 1.2; font-weight: 800; color: #1c1917; }
  h1 em { font-style: normal; color: #059669; white-space: nowrap; }
  .sub { margin-top: 28px; font-size: 30px; line-height: 1.55; color: #57534e; font-weight: 500; }

  .phone {
    position: absolute; bottom: -60px; left: 50%; transform: translateX(-50%) rotate(-2.5deg);
    width: 452px; filter: drop-shadow(0 40px 52px rgba(120,53,15,0.30));
  }
  .phone > img { display: block; width: 100%; height: auto; }
  .screen {
    position: absolute; overflow: hidden; background: #111;
    left: 5.09%; top: 2.21%; width: 89.82%; height: 95.58%;
    border-radius: 13.73% / 6.33%;
  }
  .screen img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }

  .chip {
    position: absolute; background: #ffffff; border-radius: 24px;
    box-shadow: 0 18px 40px rgba(120,53,15,0.18); padding: 20px 28px;
    display: flex; align-items: center; gap: 16px; z-index: 3;
  }
  .chip .dot { width: 20px; height: 20px; border-radius: 50%; background: #10b981; box-shadow: 0 0 0 8px rgba(16,185,129,0.15); flex: none; }
  .chip b { font-size: 27px; color: #1c1917; display: block; white-space: nowrap; }
  .chip small { font-size: 22px; color: #78716c; display: block; margin-top: 4px; white-space: nowrap; }
  .chip-1 { top: 585px; left: 40px; }
  .chip-2 { top: 715px; right: 36px; }
  .chip-2 .dot { background: #f59e0b; box-shadow: 0 0 0 8px rgba(245,158,11,0.15); }
</style>
</head>
<body>
<div class="slide">
  <div class="copy">
    <span class="tag">血糖指数</span>
    <h1>看清食物，<br />对血糖的<em>真实影响</em></h1>
    <p class="sub">餐前餐后配对分析，<br />发现对你的血糖更友好的食物</p>
  </div>

  <div class="chip chip-1"><span class="dot"></span><span><b>血糖反应 · 平稳</b><small>餐后 2h ↑ 0.8 mmol/L</small></span></div>
  <div class="chip chip-2"><span class="dot"></span><span><b>注意搭配</b><small>精制碳水反应更快</small></span></div>

  <div class="phone">
    <img src="assets/phone-frame.png" alt="" />
    <div class="screen"><img src="assets/shot-05.png" alt="" /></div>
  </div>
</div>
</body>
</html>
