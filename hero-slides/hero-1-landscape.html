<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>Hero 1 · 主受益（横版）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #cbd5e1; min-height: 100vh; display: grid; place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }
  .slide {
    width: 1920px; height: 1080px; position: relative; overflow: hidden;
    background: linear-gradient(105deg, #ecfdf5 0%, #f0fdfa 34%, #ffffff 70%, #f8fafc 100%);
  }
  .glow { position: absolute; border-radius: 50%; pointer-events: none; }
  .glow-1 { width: 1100px; height: 800px; left: -280px; top: -260px; background: radial-gradient(closest-side, rgba(0,192,154,0.16), transparent); }
  .glow-2 { width: 900px; height: 700px; right: -240px; bottom: -300px; background: radial-gradient(closest-side, rgba(0,192,154,0.10), transparent); }

  .copy { position: absolute; left: 120px; top: 50%; transform: translateY(-50%); width: 960px; }
  .brand-row { display: flex; align-items: center; gap: 22px; margin-bottom: 64px; }
  .brand-row img { width: 76px; height: 76px; border-radius: 18px; box-shadow: 0 10px 28px rgba(6,78,59,0.18); }
  .brand-row span { font-size: 42px; font-weight: 700; color: #0f172a; }

  h1 { font-size: 96px; line-height: 1.24; font-weight: 800; color: #0f172a; letter-spacing: -0.01em; }
  h1 em { font-style: normal; color: #00C09A; white-space: nowrap; position: relative; }
  h1 em svg { position: absolute; left: 4%; right: 4%; bottom: -16px; width: 92%; }
  .sub { margin-top: 44px; font-size: 40px; line-height: 1.6; color: #475569; font-weight: 500; }

  .badges {
    margin-top: 64px; display: flex;
    border-top: 1.5px solid rgba(15,23,42,0.14);
  }
  .spec { padding: 30px 56px 0 0; }
  .spec + .spec { padding-left: 56px; border-left: 1.5px solid rgba(15,23,42,0.10); }
  .spec .en {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 20px; letter-spacing: 0.22em; color: #94a3b8; text-transform: uppercase;
  }
  .spec .zh {
    margin-top: 12px; font-size: 38px; font-weight: 800; color: #0f172a;
    display: flex; align-items: center; gap: 16px; white-space: nowrap;
  }
  .spec .zh::before {
    content: ""; width: 14px; height: 14px; flex: none;
    background: #00C09A; transform: rotate(45deg);
  }

  .phone {
    position: absolute; bottom: -70px; right: 150px;
    width: 430px; filter: drop-shadow(0 40px 56px rgba(6,78,59,0.30));
  }
  .phone > img { display: block; width: 100%; height: auto; }
  .screen {
    position: absolute; overflow: hidden; background: #111;
    left: 5.09%; top: 2.21%; width: 89.82%; height: 95.58%;
    border-radius: 13.73% / 6.33%;
  }
  .screen img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
</style>
</head>
<body>
<div class="slide">
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="copy">
    <div class="brand-row">
      <img src="assets/icon.png" alt="" />
      <span>轻糖 SugarLite</span>
    </div>
    <h1>记录血糖规律，<br />发现<em>适合你<svg viewBox="0 0 220 14" fill="none"><path d="M4 10 C 60 2, 150 2, 216 8" stroke="#00C09A" stroke-width="6" stroke-linecap="round" opacity="0.55"/></svg></em>的食物</h1>
    <p class="sub">餐前餐后配对分析，帮你找到对血糖更友好的食物</p>
    <div class="badges">
      <div class="spec">
        <p class="en">Glucose Index</p>
        <p class="zh">血糖指数</p>
      </div>
      <div class="spec">
        <p class="en">Health Sync</p>
        <p class="zh">Apple 健康</p>
      </div>
      <div class="spec">
        <p class="en">AI Insights</p>
        <p class="zh">AI 智能洞察</p>
      </div>
    </div>
  </div>

  <div class="phone">
    <img src="assets/phone-frame.png" alt="" />
    <div class="screen"><img src="assets/hero-phone.png" alt="" /></div>
  </div>
</div>
</body>
</html>
