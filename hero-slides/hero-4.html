<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>Hero 4 · 智能提醒</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #cbd5e1; min-height: 100vh; display: grid; place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }
  .slide {
    width: 660px; height: 1440px; position: relative; overflow: hidden;
    background: linear-gradient(180deg, #ecfdf5 0%, #ffffff 52%, #f1f5f9 100%);
  }
  .copy { position: absolute; top: 128px; left: 0; right: 0; text-align: center; padding: 0 36px; }
  .tag {
    display: inline-block; font-size: 26px; font-weight: 700; color: #0f766e;
    background: rgba(0,192,154,0.12); padding: 12px 30px; border-radius: 999px; margin-bottom: 38px;
  }
  h1 { font-size: 70px; line-height: 1.2; font-weight: 800; color: #0f172a; }
  h1 em { font-style: normal; color: #00C09A; white-space: nowrap; }
  .sub { margin-top: 28px; font-size: 30px; line-height: 1.55; color: #475569; font-weight: 500; }

  .pills { margin-top: 34px; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; padding: 0 30px; }
  .pills span {
    font-size: 24px; font-weight: 600; color: #334155;
    background: #ffffff; border: 1.5px solid #e2e8f0;
    padding: 13px 26px; border-radius: 999px;
    box-shadow: 0 6px 16px rgba(15,23,42,0.06);
  }

  .phone {
    position: absolute; bottom: -40px; left: 50%; transform: translateX(-50%);
    width: 424px; filter: drop-shadow(0 36px 48px rgba(15,23,42,0.22));
  }
  .phone > img { display: block; width: 100%; height: auto; }
  .screen {
    position: absolute; overflow: hidden; background: #111;
    left: 5.09%; top: 2.21%; width: 89.82%; height: 95.58%;
    border-radius: 13.73% / 6.33%;
  }
  .screen img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
</style>
</head>
<body>
<div class="slide">
  <div class="copy">
    <span class="tag">血糖定时提醒</span>
    <h1>按你的节奏提醒，<br /><em>不漏一次测量</em></h1>
    <p class="sub">按时段、按间隔灵活设置，<br />养成完整的控糖记录节奏</p>
    <div class="pills">
      <span>血糖趋势追踪</span><span>运动记录</span><span>控糖食谱</span>
    </div>
  </div>

  <div class="phone">
    <img src="assets/phone-frame.png" alt="" />
    <div class="screen"><img src="assets/shot-04.png" alt="" /></div>
  </div>
</div>
</body>
</html>
